<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buscador de dados públicos</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --mut:#666; --bd:#ddd; --ac:#0b5fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eee; --mut:#999; --bd:#333; --ac:#6b9bff; } }
  body { font:16px system-ui,sans-serif; background:var(--bg); color:var(--fg); max-width:820px; margin:0 auto; padding:24px 16px; }
  form { display:flex; gap:8px; }
  input[type=search] { flex:1; padding:10px; font-size:16px; border:1px solid var(--bd); border-radius:8px; background:var(--bg); color:var(--fg); }
  button { padding:10px 18px; border:0; border-radius:8px; background:var(--ac); color:#fff; font-size:16px; cursor:pointer; }
  .fontes { display:flex; flex-wrap:wrap; gap:12px; margin:12px 0; color:var(--mut); font-size:14px; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.05em; color:var(--mut); margin:24px 0 8px; }
  .item { border:1px solid var(--bd); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
  .item a { color:var(--ac); text-decoration:none; font-weight:600; }
  .meta { color:var(--mut); font-size:13px; margin-top:4px; }
</style>
</head>
<body>
<h1>Buscador de dados públicos</h1>
<form id="f">
  <input type="search" id="q" placeholder="Ex.: energia solar, Campinas, marca X" required minlength="2">
  <button>Buscar</button>
</form>
<div class="fontes" id="fontes"></div>
<div id="out"></div>

<script>
// >>> PREENCHA com os dados do seu projeto Supabase (a anon key é pública por design)
const SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
const SUPABASE_ANON_KEY = "SUA_ANON_KEY";

const FONTES = {
  pncp: "PNCP licitações", pncp_contratos: "PNCP contratos", inpi: "INPI",
  ibge: "IBGE", dados_gov: "Dados.gov.br", onr: "ONR (matrícula)", iptu: "IPTU/cadastro",
};
const box = document.getElementById("fontes");
box.innerHTML = Object.entries(FONTES).map(([k, v]) =>
  `<label><input type="checkbox" value="${k}" checked> ${v}</label>`).join("");

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  const fontes = [...box.querySelectorAll("input:checked")].map((i) => i.value).join(",");
  const out = document.getElementById("out");
  out.textContent = "Buscando…";
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/buscar?q=${encodeURIComponent(q)}&fontes=${fontes}`, {
      headers: { Authorization: `Bearer ${SUPABASE_ANON_KEY}`, apikey: SUPABASE_ANON_KEY },
    });
    const data = await r.json();
    out.innerHTML = Object.entries(data).map(([f, itens]) => {
      const lista = Array.isArray(itens) ? itens : [itens];
      const html = lista.length ? lista.map((i) => `
        <div class="item">
          ${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.titulo || i.url)}</a>` : `<strong>${esc(i.titulo || i.aviso || i.erro || "—")}</strong>`}
          <div class="meta">${[i.orgao, i.fornecedor, i.valor && "R$ " + i.valor, i.data, i.como_obter, i.aviso && i.titulo ? i.aviso : ""].filter(Boolean).map(esc).join(" · ")}</div>
        </div>`).join("") : `<div class="meta">Sem resultados.</div>`;
      return `<h2>${esc(FONTES[f] || f)}</h2>${html}`;
    }).join("");
  } catch (err) { out.textContent = "Erro: " + err.message; }
});
</script>
</body>
</html>
